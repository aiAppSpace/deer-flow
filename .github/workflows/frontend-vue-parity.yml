# Sole formal React/Vue product/auth/SQL comparison owner.
# frontend-vue-verify.yml retains the framework, container and visual gates.
name: frontend-vue parity

on:
  push:
    paths:
      - "frontend-vue/**"
      - "frontend/**"
      - "contracts/**"
      - "backend/app/**"
      - "backend/packages/**"
      - "backend/tests/**"
      - "config.example.yaml"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - ".github/workflows/frontend-vue-verify.yml"
      - ".github/workflows/frontend-vue-parity.yml"
      - ".github/workflows/frontend-vue-parity-diagnostic.yml"

  pull_request:
    paths:
      - "frontend-vue/**"
      - "frontend/**"
      - "contracts/**"
      - "backend/app/**"
      - "backend/packages/**"
      - "backend/tests/**"
      - "config.example.yaml"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - ".github/workflows/frontend-vue-verify.yml"
      - ".github/workflows/frontend-vue-parity.yml"
      - ".github/workflows/frontend-vue-parity-diagnostic.yml"

  workflow_dispatch:

concurrency:
  group: fe-vue-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Without the sibling app every parity spec calls `test.skip(!reactAppPresent)`
  # and the suite exits 0 having asserted nothing — the exact shape of gate this
  # project keeps getting burned by. This flag makes `react-preview.ts` throw
  # instead of skipping, so a checkout that loses `../frontend` fails loudly
  # here and at every formal local cross-app entry.
  # Pinned by tests/guards/tooling-contracts.test.ts.
  PARITY_REQUIRE_REACT: "1"

jobs:
  # Separate jobs own separate Gateways. Each file remains serial internally.
  # Generate the matrix from the same whole-file planner used by each runner.
  parity-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - id: groups
        run: |
          groups=$(node frontend-vue/scripts/parity-ci.mjs --matrix)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  parity-product:
    needs: parity-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.parity-plan.outputs.groups) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      # Verbatim the same two lines as real-backend and external-gates: this job
      # starts a *real* replay Gateway too, and Gateway startup loads the browser
      # tools declared in the repo-root config.yaml. Pinned by
      # tests/guards/tooling-contracts.test.ts.
      - name: Install replay Gateway and browser dependencies
        working-directory: backend
        run: |
          uv sync --frozen --group dev --extra browser
          uv run playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      # The sibling app. `scripts/pnpm.py` runs Corepack from the selected
      # workspace, so frontend/'s own pinned pnpm is used here, not this one's.
      # Preserve the strict dependency gate previously owned by verify's
      # duplicate cross-app job; deduplication must not remove that check.
      - name: Install frontend dependencies
        run: python3 scripts/pnpm.py --dir frontend install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      # Icons, icon sizes and button variants never enter the accessibility
      # tree, so no ARIA or screenshot gate can reach them. It was local-only
      # for one reason only — "no existing workflow installs both apps'
      # node_modules" — which stopped being true two steps ago. Cheap (a source
      # scan, no servers), and it fails on a stale exemption, so it runs first.
      - name: Compare icons, icon sizes and button variants
        if: matrix.group == 'ledger'
        working-directory: frontend-vue
        run: make icon-parity

      - name: Compare one complete product file group
        working-directory: frontend-vue
        run: make e2e-parity-ci GROUP="${{ matrix.group }}"

      # Successful ledger screenshots and failed traces both leave the runner.
      - name: Upload the measured ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-product-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            frontend-vue/test-results/**
            frontend-vue/playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  # Login and setup: the first screen every user sees, and the one the main
  # parity suite can never reach. Auth is a build-time decision, so these are
  # different builds of both apps rather than more scenarios — see the header of
  # playwright.parity-auth.config.ts.
  parity-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Install replay Gateway and browser dependencies
        working-directory: backend
        run: |
          uv sync --frozen --group dev --extra browser
          uv run playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Install frontend dependencies
        run: python3 scripts/pnpm.py --dir frontend install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Measure the login and setup screens
        working-directory: frontend-vue
        run: make e2e-parity-auth

      - name: Compare authenticated SQL sessions
        working-directory: frontend-vue
        run: make e2e-parity-session

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-auth-failures-${{ github.run_attempt }}
          path: |
            frontend-vue/test-results/**
            frontend-vue/playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  # Preserve the aggregate check name; missing/cancelled/failed groups cannot pass.
  parity:
    if: always()
    needs: [parity-plan, parity-product, parity-auth]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete comparison
        run: |
          test "${{ needs.parity-plan.result }}" = success
          test "${{ needs.parity-product.result }}" = success
          test "${{ needs.parity-auth.result }}" = success

