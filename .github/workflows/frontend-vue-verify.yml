name: frontend-vue verify

on:
  push:
    paths:
      - "frontend-vue/**"
      - "frontend/src/**"
      - "frontend/tests/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/patches/**"
      - "frontend/next.config.js"
      - "contracts/**"
      - "backend/app/**"
      - "backend/packages/**"
      - "backend/tests/**"
      - "config.example.yaml"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - ".github/workflows/frontend-vue-verify.yml"
      - ".github/workflows/frontend-vue-parity-diagnostic.yml"
  pull_request:
    paths:
      - "frontend-vue/**"
      - "frontend/src/**"
      - "frontend/tests/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/patches/**"
      - "frontend/next.config.js"
      - "contracts/**"
      - "backend/app/**"
      - "backend/packages/**"
      - "backend/tests/**"
      - "config.example.yaml"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - ".github/workflows/frontend-vue-verify.yml"
      - ".github/workflows/frontend-vue-parity-diagnostic.yml"

  workflow_dispatch:
    inputs:
      generate_visual_baselines:
        description: "Generate -linux visual baselines and upload them as an artifact"
        type: boolean
        default: false

concurrency:
  group: fe-vue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Run fast verification
        working-directory: frontend-vue
        run: make verify

      # Not part of `make verify`, so nothing ran it: it stayed red across
      # several commits before anyone noticed. It reuses the build `verify`
      # just produced.
      - name: Enforce client asset budgets
        working-directory: frontend-vue
        run: make asset-budget

      # Install, build and test a separate source copy without the React app.
      # The checked-out sources and build outputs are never moved or reused.
      - name: Prove the app still stands without its sibling
        working-directory: frontend-vue
        run: make standalone-sim

      - name: Audit dependency advisories
        working-directory: frontend-vue
        run: make audit

      - name: Smoke-test production container
        working-directory: frontend-vue
        run: make container-smoke

      - name: Collect every E2E suite
        working-directory: frontend-vue
        run: make e2e-list

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Run every suite that needs no backend
        working-directory: frontend-vue
        run: make e2e-mock

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vue-verify-failure-${{ github.run_attempt }}
          path: |
            frontend-vue/test-results/**
            frontend-vue/playwright-report/**
            frontend-vue/.cache/standalone-failures/run-*/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  real-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      # 和 external-gates 那一步逐字相同，理由见下：两个 job 都要起**真的** Gateway，
      # 而 Gateway 启动时会按仓库根 config.yaml 加载浏览器工具，缺 Playwright 直接
      # `RuntimeError: Failed to load configuration during gateway startup`。
      # 此前这里只有 `uv sync --group dev`，于是 real-backend 至少从 2026-09-09 起
      # 一直红（本机绿是因为本机 venv 里装着 playwright——这正是它躲过每一轮的原因）。
      - name: Install replay Gateway and browser dependencies
        working-directory: backend
        run: |
          uv sync --frozen --group dev --extra browser
          uv run playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Verify current core Gateway schema and generated types
        working-directory: frontend-vue
        run: |
          make export-openapi-check gen-api-types-check
          ../backend/.venv/bin/python scripts/export-openapi.py --check-extension-fixture

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Run every suite that needs a real Gateway
        working-directory: frontend-vue
        run: make e2e-backend

      # G0-6 (browser WebSocket) and G0-7 (OIDC dual callback). Separate from the
      # real-backend job only because these need the backend browser extra and a
      # Gateway whose toolset includes browser_navigate, which changes the system
      # prompt and would break the run-protocol replay fixture's hash. Both are
      # hermetic — the IdP is tests/support/run_m0_idp.py, no external service.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vue-real-backend-failure-${{ github.run_attempt }}
          path: |
            frontend-vue/test-results/**
            frontend-vue/playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  external-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Install replay Gateway and browser dependencies
        working-directory: backend
        run: |
          uv sync --frozen --group dev --extra browser
          uv run playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Run browser WebSocket and OIDC gates
        working-directory: frontend-vue
        run: make e2e-external

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vue-external-gates-failure-${{ github.run_attempt }}
          path: |
            frontend-vue/test-results/**
            frontend-vue/playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  # Formal React/Vue product/auth/SQL comparison is owned only by
  # frontend-vue-parity.yml. This workflow retains Vue verification gates.
  product-visual:
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --ipc=host
    timeout-minutes: 60
    steps:
      - name: Install build orchestration
        run: apt-get update && apt-get install -y --no-install-recommends make
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: corepack enable
      - name: Install locked Vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies
      - name: Verify Linux product screenshots
        working-directory: frontend-vue
        run: make e2e-visual
      - name: Upload screenshot failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vue-product-visual-failure-${{ github.run_attempt }}
          path: |
            frontend-vue/test-results/**
            frontend-vue/playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  visual-baselines:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_visual_baselines }}
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --ipc=host
    timeout-minutes: 60
    steps:
      - name: Install build orchestration
        run: apt-get update && apt-get install -y --no-install-recommends make
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Generate -linux screenshot baselines
        working-directory: frontend-vue
        run: >-
          node scripts/with-loopback-no-proxy.mjs --
          python3 ../scripts/pnpm.py --dir frontend-vue exec
          playwright test -c playwright.visual.config.ts --update-snapshots=all

      - name: Upload generated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: frontend-vue/tests/e2e-visual/**/*-linux.png
          if-no-files-found: error
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vue-visual-baselines-failure-${{ github.run_attempt }}
          path: |
            frontend-vue/test-results/**
            frontend-vue/playwright-report/**
          if-no-files-found: warn
          retention-days: 14
