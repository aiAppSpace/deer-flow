name: frontend-vue verify

on:
  push:
    paths:
      - "frontend-vue/**"
      - "contracts/**"
      - "backend/app/gateway/**"
      - "backend/packages/harness/deerflow/runtime/**"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/tests/fixtures/replay/**"
      - "backend/tests/replay_provider.py"
      - "backend/tests/_replay_fixture.py"
      - "backend/tests/seed_runs_router.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - "backend/tests/test_pnpm_script.py"
      - "backend/tests/test_frontend_vue_startup.py"
      - ".github/workflows/frontend-vue-verify.yml"
  pull_request:
    paths:
      - "frontend-vue/**"
      - "contracts/**"
      - "backend/app/gateway/**"
      - "backend/packages/harness/deerflow/runtime/**"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/tests/fixtures/replay/**"
      - "backend/tests/replay_provider.py"
      - "backend/tests/_replay_fixture.py"
      - "backend/tests/seed_runs_router.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - "backend/tests/test_pnpm_script.py"
      - "backend/tests/test_frontend_vue_startup.py"
      - ".github/workflows/frontend-vue-verify.yml"

  workflow_dispatch:
    inputs:
      generate_visual_baselines:
        description: "Generate -linux visual baselines and upload them as an artifact"
        type: boolean
        default: false

concurrency:
  group: fe-vue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Run fast verification
        working-directory: frontend-vue
        run: make verify

      # Not part of `make verify`, so nothing ran it: it stayed red across
      # several commits before anyone noticed. It reuses the build `verify`
      # just produced.
      - name: Enforce client asset budgets
        working-directory: frontend-vue
        run: make asset-budget

      # Same story as the budget step above, and the reason this one is here:
      # `standalone-sim` moves `../frontend` aside and re-runs every file that
      # is declared as reading the sibling app, which is the only machine that
      # checks this project's stated goal -- Vue stays self-sufficient once the
      # React app is gone. It is not part of `make verify`, so nothing ran it:
      # `invented-palette-colors.test.ts` read the sibling app at *collection*
      # time from the day it was written (2026-09-12) and stayed red for twenty
      # rounds, invisible on every developer machine because `../frontend` is
      # always present there.
      #
      # It is safe in CI precisely because the job is sequential: the script
      # restores the sibling app before it exits, and nothing else in this job
      # runs while it is away.
      - name: Prove the app still stands without its sibling
        working-directory: frontend-vue
        run: make standalone-sim

      - name: Audit dependency advisories
        working-directory: frontend-vue
        run: make audit

      - name: Smoke-test production container
        working-directory: frontend-vue
        run: make container-smoke

      - name: Collect every E2E suite
        working-directory: frontend-vue
        run: make e2e-list

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      # Every suite that needs no backend process: product contracts, auth UI,
      # the same-origin proxy and the real chunked-SSE gate. Each suite builds
      # once, instead of rebuilding per --grep slice.
      #
      # e2e-visual is deliberately NOT part of e2e-mock: the screenshot
      # baselines are `-darwin` only and this runner is Linux. The Makefile
      # target carries the same note, and
      # frontend-vue/tests/guards/visual-baseline-platforms.test.ts now
      # enforces the coupling in both directions -- `-linux` baselines without
      # this step, or this step without `-linux` baselines, both fail.
      #
      # To land it: add a temporary step here running
      #   npx playwright test --config=playwright.visual.config.ts --update-snapshots
      # upload the snapshots directory with actions/upload-artifact, download
      # it, commit the `-linux` PNGs, and add `make e2e-visual` in the same
      # change. Do NOT generate them locally on an Apple Silicon Mac through
      # QEMU: there is no evidence that emulated amd64 font rasterisation
      # matches this runner, and `maxDiffPixelRatio: 0.01` over a fullPage
      # screenshot is loose enough to hide the difference -- which yields a
      # gate that looks green while guarding nothing.
      - name: Run every suite that needs no backend
        working-directory: frontend-vue
        run: make e2e-mock

  real-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      # 和 external-gates 那一步逐字相同，理由见下：两个 job 都要起**真的** Gateway，
      # 而 Gateway 启动时会按仓库根 config.yaml 加载浏览器工具，缺 Playwright 直接
      # `RuntimeError: Failed to load configuration during gateway startup`。
      # 此前这里只有 `uv sync --group dev`，于是 real-backend 至少从 2026-09-09 起
      # 一直红（本机绿是因为本机 venv 里装着 playwright——这正是它躲过每一轮的原因）。
      - name: Install replay Gateway and browser dependencies
        working-directory: backend
        run: |
          uv sync --group dev --extra browser
          uv run playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Run every suite that needs a real Gateway
        working-directory: frontend-vue
        run: make e2e-backend

  # G0-6 (browser WebSocket) and G0-7 (OIDC dual callback). Separate from the
  # real-backend job only because these need the backend browser extra and a
  # Gateway whose toolset includes browser_navigate, which changes the system
  # prompt and would break the run-protocol replay fixture's hash. Both are
  # hermetic — the IdP is tests/support/run_m0_idp.py, no external service.
  external-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Install replay Gateway and browser dependencies
        working-directory: backend
        run: |
          uv sync --group dev --extra browser
          uv run playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Run browser WebSocket and OIDC gates
        working-directory: frontend-vue
        run: make e2e-external

  # One-shot, manual. `make e2e-visual` cannot enter CI until `-linux`
  # screenshot baselines exist, and this runner is the only place allowed to
  # produce them: baselines generated locally through amd64 emulation have no
  # evidence of matching this runner's font rasterisation, and
  # `maxDiffPixelRatio: 0.01` over a fullPage screenshot is loose enough to
  # hide the difference — which yields a gate that looks green while guarding
  # nothing. See frontend-vue/tests/guards/visual-baseline-platforms.test.ts.
  #
  # Run this job from the Actions tab with the input checked, download the
  # `visual-baselines-linux` artifact, commit the `-linux` PNGs, and add
  # `make e2e-visual` to the verify job in the SAME change — that guard fails
  # if either half lands alone. Deliberately does NOT invoke `make e2e-visual`:
  # generating baselines is not running the gate, and the guard reads this
  # file for that command.
  visual-baselines:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_visual_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Generate -linux screenshot baselines
        working-directory: frontend-vue
        run: >-
          node scripts/with-loopback-no-proxy.mjs --
          python3 ../scripts/pnpm.py --dir frontend-vue exec
          playwright test -c playwright.visual.config.ts --update-snapshots

      - name: Upload generated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: frontend-vue/tests/e2e-visual/**/*-linux.png
          if-no-files-found: error
